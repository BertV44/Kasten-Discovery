name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Lets the deliverables be built on demand, without cutting a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actions/setup-go is deliberately not used.
      #
      # The runner fetches every external action from codeload.github.com during
      # "Set up job" -- before the checkout, before any of this repository exists
      # on the machine. On 2026-08-17 that fetch returned 503 then 429 and every
      # run died at step 1 of 8, with nothing of ours having executed and six red
      # annotations that named no file of ours. GitHub-hosted runners already
      # ship a Go toolchain, so the action bought a failure mode and nothing else.
      #
      # The version floor moves to go.mod, which is where it is really declared.
      # It used to be duplicated in a GO_VERSION env var, and two copies of one
      # number drift.
      #
      # The trade: setup-go pins an exact toolchain and caches modules. This
      # accepts whatever the runner ships if it is new enough, and re-downloads
      # modules each run -- which costs more now that client-go is a dependency.
      # A CI that runs slowly beats a CI that cannot start.
      - name: Go toolchain
        run: |
          required=$(awk '/^go /{print $2; exit}' go.mod)
          have=$(go env GOVERSION | sed 's/^go//')
          echo "go.mod requires >= ${required}; runner has ${have}"
          if [ "$(printf '%s\n%s\n' "$required" "$have" | sort -V | head -1)" != "$required" ]; then
            echo "::error::runner Go ${have} is older than the ${required} go.mod requires"
            exit 1
          fi
          go version

      # _legacy/ holds the superseded v1.0 sketch, which is not valid Go. The go
      # tool skips underscore-prefixed directories on its own; gofmt does not.
      # Filtering its output is not enough -- gofmt still writes a parse error to
      # stderr, which GitHub turns into a red annotation on an otherwise green run,
      # and a permanent red annotation teaches everyone to ignore annotations. So
      # point gofmt at the real source directories instead of the whole tree.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Fixture-backed tests skip when testdata/report.json is absent, which it is
      # here: discovery reports are customer-derived and never committed. -count=1
      # disables the test cache so a green run always means a real run.
      - name: Test
        run: go test -count=1 ./...

      # A skip is legitimate, but it should be visible rather than silent: a reader
      # of the CI log needs to know the fixture-backed tests did not actually run.
      - name: Report skipped tests
        if: always()
        run: |
          go test -count=1 -v ./... 2>&1 | grep -E '^\s*--- SKIP' || \
            echo "No skipped tests."

  build:
    name: Build deliverables
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      # Same reasoning as the verify job: no external action, floor read from
      # go.mod. Verify has already run by the time this job starts, so a
      # toolchain too old has been rejected once already; repeating the check
      # keeps this job independently correct if the two ever run apart.
      - name: Go toolchain
        run: |
          required=$(awk '/^go /{print $2; exit}' go.mod)
          have=$(go env GOVERSION | sed 's/^go//')
          if [ "$(printf '%s\n%s\n' "$required" "$have" | sort -V | head -1)" != "$required" ]; then
            echo "::error::runner Go ${have} is older than the ${required} go.mod requires"
            exit 1
          fi
          go version

      # Static by construction: CGO off, and the binary embeds its own CSS, JS and
      # templates, so a single file is the whole deliverable. That is the point of
      # choosing Go -- it has to run on a customer bastion host with nothing
      # installed on it.
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) version="${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)" ;;
          esac
          out="kdl-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version}" \
            -o "dist/${out}" ./cmd/kdl
          ls -l "dist/${out}"
          "dist/${out}" version 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: kdl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/kdl-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  # A binary a customer runs on their cluster host needs a checksum they can
  # verify, so it is produced by CI rather than by hand.
  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate
        run: |
          cd dist
          sha256sum kdl-* | tee checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Static binaries, no runtime dependencies. Verify before running:

            ```
            sha256sum -c checksums.txt --ignore-missing
            ```
